# Déploiement Render (render.com) : détecté automatiquement à la création
# du Web Service. Plan gratuit : le service s'endort après 15 min
# d'inactivité et met environ 30 s à se réveiller.
services:
  - type: web
    name: trainedml-webapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
